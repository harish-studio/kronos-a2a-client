[project]
name = "kronos-a2a-client"
version = "0.1.0"
description = "A separate agent that discovers kronos-agent over A2A and delegates a task to it."
requires-python = ">=3.11"
# The public A2A SDKs and nothing else. Pinned to the versions the
# kronos-agent server is built against, so a protocol change on either
# side is a deliberate bump, not a drift.
dependencies = [
    "a2a-sdk==1.1.2",
    # No stable release exists yet. Pinning the pre-release exactly is
    # enough for pip to accept it, so installs do NOT use --pre: --pre
    # lets every dependency resolve to a pre-release, and pulled in
    # httpx 1.0.dev6, which has no AsyncClient.
    "agent-framework-a2a==1.0.0b260910",
    "httpx>=0.28.1,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["client"]
